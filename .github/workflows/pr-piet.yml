name: PR-Piet

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-piet-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-piet:
    if: ${{ github.event.sender.type != 'Bot' }}
    # TEST-PIN (tier2-pending-guard E2E 2026-09-23): na verificatie terug naar @main
    uses: m0nklabs/pr-piet/.github/workflows/reusable-pr-piet.yml@tier2-pending-guard
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
      base_branch: ${{ github.event.pull_request.base.ref || '' }}
      enable_tier2: true
      single_call_review: true
      auto_describe: true
      auto_improve: true
      response_language: en-US
      # TEST-PIN: gate-script tier2_pending_guard.py bestaat alleen op deze ref
      pr_piet_ref: tier2-pending-guard
    secrets:
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
