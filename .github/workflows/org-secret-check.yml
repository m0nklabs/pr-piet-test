name: org-secret-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux]
    steps:
      - run: |
          if [ -z "$ORG" ]; then echo "ORG: LEEG"; else echo "ORG: len=${#ORG} fp=$(printf '%s' "$ORG" | sha256sum | cut -c1-12)"; fi
        env:
          ORG: ${{ secrets.GUARDIAN_API_KEY }}
